      assistantbench: {samples: 24, task_groups: 6, positive: 11, negative: 13}
      visualwebarena: {samples: 24, task_groups: 8, positive: 7, negative: 17}
      webarena: {samples: 88, task_groups: 22, positive: 37, negative: 51}
      workarena: {samples: 60, task_groups: 15, positive: 37, negative: 23}

inner_folds:
  path: artifacts/a1_3_lobo_inner_folds.csv
  candidates: [5, 4, 3, 2]
  seed: 2026
  selection: maximum_feasible
  algorithm: custom_deterministic_grouped_stratification_v1
  namespace_template: 'a1_3|inner|{target}|heldout|{held_out_group}'
  held_out_role_in_source_manifest: validation
  held_out_role_in_frozen_artifact: held_out

baselines:
  - {id: B0, name: dummy_most_frequent, estimator: DummyClassifier, strategy: most_frequent}
  - {id: B1, name: dummy_prior, estimator: DummyClassifier, strategy: prior}
  - {id: B2, name: structural_lr, estimator: StandardScaler+LogisticRegression, input: frozen_structural_features}
  - {id: B3, name: tfidf_lr, estimator: TfidfVectorizer+LogisticRegression, input: primary_with_natural_errors}

logistic_regression:
  penalty: l2
  solver: liblinear
  max_iter: 5000
  fit_intercept: true
  random_state: 2026

structural_features:
  - step_count
  - nonempty_action_count
  - nonempty_observation_count
  - nonempty_focused_element_count
  - natural_error_step_count
  - natural_error_step_ratio
  - has_explicit_termination_signal
  - action_char_count_total
  - observation_char_count_total
  - action_char_count_mean_nonempty
  - observation_char_count_mean_nonempty
  - unique_action_ratio
  - consecutive_duplicate_action_count

tfidf:
  T1: {ngram_range: [1, 1]}
  T2: {ngram_range: [1, 2]}
  common:
    lowercase: true
    strip_accents: unicode
    min_df: 2
    max_df: 1.0
    max_features: 20000
    sublinear_tf: true
    norm: l2
    use_idf: true
    smooth_idf: true
    token_pattern: '(?u)\b\w\w+\b'

selection:
  configuration_data: pooled_inner_oof_from_three_training_benchmarks_only
  configuration_metric: average_precision_score
  configuration_direction: maximize
  B2_tie_break: [class_weight_none, smaller_C, config_id]
  B3_tie_break: [T1, class_weight_none, smaller_C, config_id]
  threshold_data: selected_configuration_pooled_inner_oof_only
  threshold_metric: positive_f1
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  threshold_tie_break: [higher_recall, closer_to_0.5, smaller_threshold]

metrics:
  pr_auc_implementation: sklearn.metrics.average_precision_score
  primary: [pr_auc_average_precision, positive_f1]
  secondary: [roc_auc, precision, recall, f2, balanced_accuracy, mcc]
  positive_label: 1
  zero_division: 0
  macro_standard_deviation_ddof: 1
  single_class_metric_value: null
  single_class_negative_status: single_class_negative

execution:
  allowed_scope: benchmark_group_primary_four_group_lobo_official_dev_only
  required_preregistration_commit_subject: 'fix: normalize primary lobo preregistration bytes'
  git_worktree_must_be_clean: true
  external_evaluations_per_target_baseline_held_out_group: 1
  test_access: false
  input_view: primary_with_natural_errors
  baselines_exactly: [B0, B1, B2, B3]
  expected_config_selection_rows: 240
  expected_threshold_selection_rows: 912
  expected_external_prediction_rows: 2332
  expected_domain_metric_rows: 48
  forbidden_experiments:
    - test_evaluation
    - secondary_five_group_lobo
    - leave_one_model_out
    - reasoning_sensitivity
    - error_ablation
    - benchmark_literal_redaction
    - embedding
    - mlp
    - random_forest
    - xgboost
    - transformer
    - lora
    - llm_judge
    - screenshot_or_multimodal
    - char_ngram
    - B2_B3_fusion

signal_grading:
  robust_minimum_mixed_domain_fraction: 0.75
  requires_same_learned_baseline: true
  pooled_ap_above_prevalence: true
  pooled_f1_above_both_dummies: true
  domain_ap_above_prevalence: true
  domain_f1_above_both_dummies: true
  no_integrity_or_implementation_anomaly: true
  not_assessable_below_mixed_domains: 2

outputs:
  inner_config_selection: artifacts/a1_3_lobo_inner_config_selection.csv
  inner_selected_oof_predictions: artifacts/a1_3_lobo_inner_selected_oof_predictions.csv
  threshold_selection: artifacts/a1_3_lobo_threshold_selection.csv
  predictions: artifacts/a1_3_lobo_predictions.csv
  domain_metrics: artifacts/a1_3_lobo_domain_metrics.csv
  macro_metrics: artifacts/a1_3_lobo_macro_metrics.csv
  pooled_metrics: artifacts/a1_3_lobo_pooled_metrics.csv
  config_frequency: artifacts/a1_3_lobo_config_frequency.csv
  comparison_to_a1_2: artifacts/a1_3_lobo_comparison_to_a1_2.csv
  run_summary: artifacts/a1_3_lobo_run_summary.json
  report: docs/stage_a1_3_primary_lobo_report.md

environment:
  virtual_environment: .venv-baselines
  lock_file: requirements/baseline-lock.txt
  lock_file_sha256: 6ad6b9933a8d435a95415903296d6c6d0aaf186a5f7f27812640c0e0b0f4e971
  environment_artifact: artifacts/baseline_environment.json
  environment_artifact_sha256: f6b830c652bd75149651cd8ab9390a9a318e2bf963f79dcbd8a5ba6c2c9b0a7b
  prerun_integrity_artifact: artifacts/a1_3_lobo_prerun_integrity.json
  gpu_allowed: false
  formal_run_network_allowed: false
