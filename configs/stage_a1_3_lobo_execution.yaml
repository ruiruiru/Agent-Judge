      visualwebarena: {samples: 24, task_groups: 8, positive: 12, negative: 12}
      webarena: {samples: 84, task_groups: 22, positive: 25, negative: 59}
      workarena: {samples: 60, task_groups: 15, positive: 19, negative: 41}
  side_effect:
    expected_samples: 195
    expected_positive: 12
    expected_negative: 183
    positive_semantics: side_effect_present
