  run_summary: {path: artifacts/a1_3_lobo_run_summary.json, sha256: ec4055a20fe7ab1d6df5d3e51b76962ef8ce642073ccc50563cad4c92bcc39e5}
  report: {path: docs/stage_a1_3_primary_lobo_report.md, sha256: b6914d76cca3283906266fea37320ae1022103ab9b4b6809ef19fd1291457d78}

primary_benchmarks: [assistantbench, visualwebarena, webarena, workarena]
model_set:
  source: manifest_distinct_held_out_model
  expected_count: 4
  known_partial_selector: casefold_contains_meta-llama
  expected_missing_primary_benchmark: visualwebarena

targets:
  success: {expected_samples: 192, expected_positive: 58, expected_negative: 134}
  side_effect: {expected_samples: 195, expected_positive: 12, expected_negative: 183, positive_semantics: side_effect_present}
  looping: {expected_samples: 196, expected_positive: 92, expected_negative: 104}

group_key: benchmark_original::normalized_task_id
external_group_overlap:
  allowed: true
  joint_task_model_holdout: false
  interpretation: model_only_generalization_not_joint_task_model_ood

inner_folds:
  path: artifacts/a1_4_lomo_inner_folds.csv
  candidates: [5, 4, 3, 2]
  seed: 2026
  selection: maximum_feasible
  algorithm: custom_deterministic_grouped_stratification_v1
  namespace_template: 'a1_4|inner|{target}|heldoutmodel|{held_out_model}'

baselines:
  - {id: B0, name: dummy_most_frequent, estimator: DummyClassifier, strategy: most_frequent}
  - {id: B1, name: dummy_prior, estimator: DummyClassifier, strategy: prior}
  - {id: B2, name: structural_lr, estimator: StandardScaler+LogisticRegression, input: frozen_structural_features}
  - {id: B3, name: tfidf_lr, estimator: TfidfVectorizer+LogisticRegression, input: primary_with_natural_errors}

logistic_regression: {penalty: l2, solver: liblinear, max_iter: 5000, fit_intercept: true, random_state: 2026}

structural_features:
  - step_count
  - nonempty_action_count
  - nonempty_observation_count
  - nonempty_focused_element_count
  - natural_error_step_count
  - natural_error_step_ratio
  - has_explicit_termination_signal
  - action_char_count_total
  - observation_char_count_total
  - action_char_count_mean_nonempty
  - observation_char_count_mean_nonempty
  - unique_action_ratio
  - consecutive_duplicate_action_count

tfidf:
  T1: {ngram_range: [1, 1]}
  T2: {ngram_range: [1, 2]}
  common:
    lowercase: true
    strip_accents: unicode
    min_df: 2
    max_df: 1.0
    max_features: 20000
    sublinear_tf: true
    norm: l2
    use_idf: true
    smooth_idf: true
    token_pattern: '(?u)\b\w\w+\b'

selection:
  configuration_data: pooled_inner_oof_from_other_three_models_only
  configuration_metric: average_precision_score
  configuration_direction: maximize
  B2_tie_break: [class_weight_none, smaller_C, config_id]
  B3_tie_break: [T1, class_weight_none, smaller_C, config_id]
  threshold_data: selected_configuration_pooled_inner_oof_only
  threshold_metric: positive_f1
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  threshold_tie_break: [higher_recall, closer_to_0.5, smaller_threshold]

metrics:
  pr_auc_implementation: sklearn.metrics.average_precision_score
  primary: [pr_auc_average_precision, positive_f1]
  secondary: [roc_auc, precision, recall, f2, balanced_accuracy, mcc]
  positive_label: 1
  zero_division: 0
  macro_standard_deviation_ddof: 1
  diagnostic_single_class_metric_value: null

execution:
  allowed_scope: leave_one_model_out_official_dev_b0_b3_only
  required_preregistration_commit_subject: 'chore: preregister leave-one-model-out baselines'
  git_worktree_must_be_clean: true
  external_evaluations_per_target_baseline_held_out_model: 1
  test_access: false
  test_manifest_access: false
  input_view: primary_with_natural_errors
  baselines_exactly: [B0, B1, B2, B3]
  expected_config_selection_rows: 240
  expected_threshold_selection_rows: 912
  expected_external_prediction_rows: 2332
  expected_selected_inner_oof_rows: 6996
  expected_model_metric_rows: 48
  forbidden_experiments:
    - test_evaluation
    - primary_lobo_rerun
    - secondary_five_group_lobo
    - task_model_joint_holdout
    - reasoning_sensitivity
    - error_ablation
    - benchmark_literal_redaction
    - model_literal_redaction
    - embedding
    - mlp
    - random_forest
    - xgboost
    - transformer
    - lora
    - llm_judge
    - screenshot_or_multimodal
    - char_ngram
    - B2_B3_fusion

signal_grading:
  labels: [robust_cross_model_signal, partial_or_model_specific_signal, no_cross_model_signal, not_assessable]
  minimum_full_coverage_models: 2

outputs:
  coverage_matrix: artifacts/a1_4_lomo_coverage_matrix.csv
  model_literal_audit: artifacts/a1_4_model_literal_audit.csv
  inner_config_selection: artifacts/a1_4_lomo_inner_config_selection.csv
  inner_selected_oof_predictions: artifacts/a1_4_lomo_inner_selected_oof_predictions.csv
  threshold_selection: artifacts/a1_4_lomo_threshold_selection.csv
  predictions: artifacts/a1_4_lomo_predictions.csv
  model_metrics: artifacts/a1_4_lomo_model_metrics.csv
  model_benchmark_diagnostics: artifacts/a1_4_lomo_model_benchmark_diagnostics.csv
  macro_metrics: artifacts/a1_4_lomo_macro_metrics.csv
  pooled_metrics: artifacts/a1_4_lomo_pooled_metrics.csv
  config_frequency: artifacts/a1_4_lomo_config_frequency.csv
  comparison: artifacts/a1_4_lomo_comparison.csv
  run_summary: artifacts/a1_4_lomo_run_summary.json
  report: docs/stage_a1_4_leave_one_model_out_report.md

environment:
  virtual_environment: .venv-baselines
  lock_file: requirements/baseline-lock.txt
  lock_file_sha256: 6ad6b9933a8d435a95415903296d6c6d0aaf186a5f7f27812640c0e0b0f4e971
  environment_artifact: artifacts/baseline_environment.json
  environment_artifact_sha256: f6b830c652bd75149651cd8ab9390a9a318e2bf963f79dcbd8a5ba6c2c9b0a7b
  prerun_integrity_artifact: artifacts/a1_4_lomo_prerun_integrity.json
  gpu_allowed: false
  formal_run_network_allowed: false
