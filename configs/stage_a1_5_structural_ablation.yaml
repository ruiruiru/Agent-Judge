  - has_explicit_termination_signal
  - action_char_count_total
  - observation_char_count_total
  - action_char_count_mean_nonempty
  - observation_char_count_mean_nonempty
  - unique_action_ratio
  - consecutive_duplicate_action_count

feature_groups:
  G1_activity_volume: [step_count, nonempty_action_count, nonempty_observation_count, nonempty_focused_element_count, action_char_count_total, observation_char_count_total, action_char_count_mean_nonempty, observation_char_count_mean_nonempty]
  G2_error: [natural_error_step_count, natural_error_step_ratio]
  G3_termination: [has_explicit_termination_signal]
  G4_repetition: [unique_action_ratio, consecutive_duplicate_action_count]

variants:
  - {id: S0_full13, include_groups: [G1_activity_volume, G2_error, G3_termination, G4_repetition], interpretation: reference}
  - {id: S1_no_termination, include_groups: [G1_activity_volume, G2_error, G4_repetition], removed_groups: [G3_termination]}
  - {id: S2_no_repetition, include_groups: [G1_activity_volume, G2_error, G3_termination], removed_groups: [G4_repetition]}
  - {id: S3_no_activity_volume, include_groups: [G2_error, G3_termination, G4_repetition], removed_groups: [G1_activity_volume]}
  - {id: S4_no_error, include_groups: [G1_activity_volume, G3_termination, G4_repetition], removed_groups: [G2_error]}
  - {id: S5_no_termination_or_repetition, include_groups: [G1_activity_volume, G2_error], removed_groups: [G3_termination, G4_repetition]}
  - {id: S6_termination_repetition_only, include_groups: [G3_termination, G4_repetition], interpretation: sufficiency_only}

logistic_regression:
  penalty: l2
  solver: liblinear
  max_iter: 5000
  fit_intercept: true
  random_state: 2026
  C: [0.1, 1.0, 10.0]
  class_weight: [null, balanced]

selection:
  configuration_data: pooled_inner_oof_from_nonheldout_benchmarks_only
  configuration_metric: sklearn.metrics.average_precision_score
  configuration_direction: maximize
  configuration_tie_break: [class_weight_none, smaller_C, config_id_lexical]
  threshold_data: selected_configuration_pooled_inner_oof_only
  threshold_metric: positive_f1
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  threshold_tie_break: [higher_recall, closer_to_0.5, smaller_threshold]

metrics:
  primary: [pr_auc_average_precision, positive_f1]
  secondary: [roc_auc, precision, recall, f2, balanced_accuracy, mcc]
  positive_label: 1
  zero_division: 0
  macro_standard_deviation_ddof: 1
  single_class_metric_value: null
  single_class_negative_status: single_class_negative
  retained_ap_lift_ratio:
    denominator: S0 pooled AP lift
    numerator: variant pooled AP lift
    nonpositive_variant_lift: 0
    nonpositive_s0_lift: null

dependency_classification:
  strong:
    retained_ap_lift_ratio_lt: 0.50
    mixed_domain_ap_decline_fraction_gte: 0.75
    domains_with_absolute_ap_decline_gte_0p05: 2
  moderate:
    retained_ap_lift_ratio_gte: 0.50
    retained_ap_lift_ratio_lt: 0.80
    mixed_domain_ap_decline: majority
  limited:
    retained_ap_lift_ratio_gte: 0.80
    fallback_when_strong_or_moderate_not_fully_satisfied: true
  side_effect_interpretation: exploratory_structural_dependency_only
  nonpositive_s0_lift_classification: not_assessable_nonpositive_s0_ap_lift
  reference_classification: reference
  sufficiency_classification: sufficiency_only_not_dependency_grade

execution:
  required_preregistration_commit_subject: "chore: preregister structural mechanism ablations"
  git_worktree_must_be_clean: true
  first_formal_phase: S0_full13_positive_control_only
  continue_only_if_s0_exact: true
