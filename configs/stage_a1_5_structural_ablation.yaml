  official_dev_only: true
  model_input_exactly: artifacts/dev_structural_features.csv
  reuse_outer_manifest_exactly: artifacts/lobo_primary_manifest.csv
  reuse_inner_folds_exactly: artifacts/a1_3_lobo_inner_folds.csv
