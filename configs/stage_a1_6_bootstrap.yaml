targets: [success, side_effect, looping]
held_out_groups: [assistantbench, visualwebarena, webarena, workarena]
group_key_definition: [benchmark_original, normalized_task_id]
group_key_serialization: benchmark_original::normalized_task_id

methods:
  a1_3: [B0, B1, B2, B3]
  a1_5: [S0_full13, S1_no_termination, S2_no_repetition, S3_no_activity_volume, S4_no_error, S5_no_termination_or_repetition, S6_termination_repetition_only]

bootstrap:
  unit: task_group_cluster
  strata: [target, held_out_group]
  n_bootstrap_draws: 10000
  seed: 2026
  numpy_rng: numpy.random.Generator
  bit_generator: numpy.random.PCG64
  confidence_level: 0.95
  interval_method: percentile
  percentiles: [2.5, 97.5]
  stratified: false
  redraw_invalid: false
  impute_invalid: false
  macro_minimum_valid_mixed_domains: 2
  prevalence_source: bootstrap_draw
  pooled_role: secondary
  parallel_workers: 8

primary_comparisons:
  - {id: P1, target: success, kind: positive_signal, source: a1_3, method_a: B2, scope: macro, metric: ap_lift, role: primary}
  - {id: P2, target: success, kind: paired_delta, source: a1_3, method_a: B2, method_b: B3, scope: macro, metric: ap, role: primary}
  - {id: P2, target: success, kind: paired_delta, source: a1_3, method_a: B2, method_b: B3, scope: macro, metric: f1, role: primary}
  - {id: P3, target: success, kind: paired_delta, source: a1_5, method_a: S1_no_termination, method_b: S0_full13, scope: macro, metric: ap, role: primary}
  - {id: P3, target: success, kind: paired_delta, source: a1_5, method_a: S1_no_termination, method_b: S0_full13, scope: pooled, metric: ap, role: auxiliary}
  - {id: P3, target: success, kind: paired_delta, source: a1_5, method_a: S1_no_termination, method_b: S0_full13, scope: macro, metric: f1, role: auxiliary}
  - {id: P4, target: success, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: macro, metric: ap, role: primary}
  - {id: P4, target: success, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: pooled, metric: ap, role: auxiliary}
  - {id: P4, target: success, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: macro, metric: f1, role: auxiliary}
  - {id: P5, target: looping, kind: positive_signal, source: a1_3, method_a: B2, scope: macro, metric: ap_lift, role: primary}
  - {id: P6, target: looping, kind: paired_delta, source: a1_5, method_a: S2_no_repetition, method_b: S0_full13, scope: macro, metric: ap, role: primary}
  - {id: P6, target: looping, kind: paired_delta, source: a1_5, method_a: S2_no_repetition, method_b: S0_full13, scope: pooled, metric: ap, role: auxiliary}
  - {id: P6, target: looping, kind: paired_delta, source: a1_5, method_a: S2_no_repetition, method_b: S0_full13, scope: macro, metric: f1, role: auxiliary}
  - {id: P7, target: looping, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: macro, metric: ap, role: primary}
  - {id: P7, target: looping, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: pooled, metric: ap, role: auxiliary}
  - {id: P7, target: looping, kind: paired_delta, source: a1_5, method_a: S6_termination_repetition_only, method_b: S0_full13, scope: macro, metric: f1, role: auxiliary}
  - {id: P8, target: side_effect, kind: support_diagnostic, source: a1_3, method_a: B3, scope: macro, metric: ap, role: primary}

grade_rules:
  valid_fraction_low_support_lt: 0.80
  valid_fraction_stable_positive_gte: 0.95
  positive_ci_lower_gt: 0.0
  delta_ci_upper_lt: 0.0
  delta_ci_lower_gt: 0.0
  p8_never_upgrades_side_effect: true

execution:
  required_preregistration_commit_subject: "chore: preregister group-aware bootstrap uncertainty"
  git_worktree_must_be_clean: true
  model_training_allowed: false
  prediction_regeneration_allowed: false
  config_reselection_allowed: false
  threshold_reselection_allowed: false
  test_access: false
  forbidden_call_tokens: [".fit(", ".fit_transform(", "partial_fit("]
  forbidden_experiments: [complex_model, fusion, secondary_lobo, lomo, joint_ood, test, stratified_bootstrap, trajectory_bootstrap, invalid_redraw]

outputs:
